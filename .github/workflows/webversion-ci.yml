name: webversion-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  webversion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webversion/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
